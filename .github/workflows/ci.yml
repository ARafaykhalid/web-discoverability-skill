name: CI

# Every gate in brief section 17 maps to a step below, and the mapping is written
# out in comments so an auditor can trace a requirement to the command that
# enforces it rather than trusting that "CI passes" means something.
#
# Two things are deliberately NOT gates on a pull request:
#
#   check-sources      makes a live HTTP request to every cited URL. A source
#                      being briefly unreachable says nothing about the change
#                      under review, and a build that fails for reasons the
#                      author cannot fix teaches people to ignore red builds.
#   stale-requirements --strict
#                      fails when a source's review interval has elapsed. That is
#                      a function of the calendar, not of the diff.
#
# Both run on a schedule instead, where a failure is a maintenance signal aimed
# at the maintainer rather than a blocked contributor.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 07:11 UTC. Off the hour on purpose: scheduled runs across GitHub
    # bunch up at :00 and get queued.
    - cron: '11 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Registry integrity. Nothing here touches a fixture or runs a check; it is
  # entirely about whether the requirement data is internally coherent.
  # ---------------------------------------------------------------------------
  registry:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Every command here is local and finishes in seconds. The ceiling exists so a
    # hang fails the job instead of holding a runner for the six-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          # No `cache: npm`: that needs a lockfile, and there is nothing to lock.
          # See the install step below.

      # No install step, and no lockfile. The package declares zero dependencies and
      # zero devDependencies, so `npm ci` would fail for want of a lockfile and
      # would have nothing to fetch if it succeeded. Every command in this job is
      # plain Node plus node:test.
      #
      # The typecheck step below is the one exception in the whole workflow: it
      # installs a typechecker into node_modules with --no-save, which touches
      # neither package.json nor the lockfile. It is stated here rather than left
      # implicit because an install is a material change to the supply-chain
      # surface, and the next person to add one should have to argue for it in the
      # same place.
      # The claim is in README.md and SECURITY.md, so it gets checked rather than
      # asserted: a dependency cannot appear without this failing first.
      - name: Confirm the zero-dependency claim
        run: node -e 'const p=require("./package.json");const d=[...Object.keys(p.dependencies??{}),...Object.keys(p.devDependencies??{})];d.length?console.error("package.json declares dependencies:",d.join(", "),"- the documentation states there are none"):console.log("zero dependencies")'

      # Section 17: schema validation, registry integrity, duplicate detection,
      # dependency validation, circular dependency detection, source presence,
      # missing verification, unsupported claims. `validate` exits 1 on any error,
      # which is what makes a pull request introducing one of these fail.
      - name: Registry integrity
        run: npm run validate

      # Section 2 and section 18: the registry-quality report. Distinct from
      # `validate` in that it quantifies rather than gates - near-duplicate
      # clusters, missing metadata, requirements with no test - and fails when a
      # quantity crosses a threshold the repository has committed to.
      - name: Registry quality report
        run: npm run quality

      # Section 5: every externally dependent requirement resolves to a source in
      # the manifest. Offline - this reads the registry, it does not fetch.
      - name: Source manifest
        run: npm run sources

      # Section 16: reported, not enforced, on a pull request. Printed so the
      # number is visible in the log of every build rather than only when the
      # weekly job fails.
      - name: Requirements overdue for re-verification (informational)
        run: npm run stale

      # Section 14 and 17: documentation consistency. This is the step that fails
      # when a generated block was hand-edited, when a schema on disk no longer
      # matches the model, or when prose contains an outcome claim the project
      # does not support ("guarantees rankings", "production proven",
      # "most comprehensive").
      #
      # The benchmark figures quoted in README.md are computed inside this command,
      # so the table is compared against what this commit actually produces rather
      # than against a committed copy that could have drifted from it.
      - name: Documentation and generated artefacts
        run: npm run docs:check

  # ---------------------------------------------------------------------------
  # Behaviour: the test suite and the benchmark scores. Matrixed across the Node
  # versions the package claims to support, so `engines` is a tested claim.
  # ---------------------------------------------------------------------------
  behaviour:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Two matrix legs, and the typecheck step installs a package; ten minutes is
    # generous for both on a cold runner.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # engines.node is >=22.18.0: the first release where Node runs .ts files
        # by native type stripping without a flag, which is how this package
        # stays dependency-free. 22.x is the floor that claim promises; if it
        # breaks here, the floor is wrong and should be raised rather than the
        # failure worked around.
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      # Sections 6 and 8: registry integrity tests, check unit tests, and one
      # regression test per fixed bug. `node --test` with no positional argument
      # discovers tests recursively; a positional directory argument fails on
      # Node 24, which is why the script has no path in it.
      - name: Test suite
        run: npm test

      # Section 7: score every benchmark case. `bench:check` writes nothing, so a
      # matrix leg cannot race another leg over reports/.
      - name: Benchmarks
        run: npm run bench:check

      # Section 21: run the shipped command against a fixture. `bench` filters
      # checks by requirement applicability exactly as `audit` does, so the two
      # are close - but `audit` is what a user actually invokes, and this is the
      # only step that would catch a crash in its reporting or exit-code path.
      # Asserting the output parses is what makes --json a supported interface
      # rather than a debugging convenience. One fixture is enough: what is being
      # tested is the command's argument and reporting path, not per-fixture
      # behaviour, which `bench` above already scores for every fixture.

      # The annotations in tools/ are otherwise unchecked: Node erases types without
      # validating them, so a wrong interface or a non-erasable annotation - which
      # crashes Node at import, with no build step to catch it - would reach a user
      # of the skill as a runtime failure. See tsconfig.json for why `strict` is off
      # and what this gate is actually for.
      - name: Typecheck
        run: npm run typecheck
      - name: Audit a fixture end to end
        run: |
          set -euo pipefail
          node tools/cli.ts audit benchmarks/fixtures/defective-static --json \
            | node -e 'const c=[];process.stdin.on("data",d=>c.push(d));process.stdin.on("end",()=>{const r=JSON.parse(c.join(""));if(!Array.isArray(r.findings))throw new Error("no findings array");if(!r.framework)throw new Error("no framework");console.log(`${r.findings.length} findings, framework ${r.framework}`)})'

  # ---------------------------------------------------------------------------
  # Maintenance. Scheduled only, for the reasons at the top of this file: these
  # two fail on conditions a contributor cannot see in their own diff.
  # ---------------------------------------------------------------------------
  maintenance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # check-sources makes a few hundred network requests with a 15s timeout each,
    # so this is the one job where the ceiling is close to real.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      # Section 5. A cited source that has moved or disappeared is the failure
      # mode this repository is most exposed to, because a requirement whose
      # evidence has evaporated still looks fully specified from the inside.
      - name: Cited sources are reachable
        run: npm run check-sources

      # Section 16. Fails rather than reports here, because on a schedule that is
      # the whole point: something has to eventually insist that a rule about
      # external behaviour gets looked at again.
      - name: Requirements overdue for re-verification
        run: node tools/cli.ts stale-requirements --strict

      # If a source moved or a review lapsed, the registry may still validate
      # while being wrong about the world. Running the fast gates too means the
      # weekly job answers "is this repository still correct?" rather than only
      # "are its links still alive?".
      - name: Registry integrity
        run: npm run validate

      - name: Test suite
        run: npm test
