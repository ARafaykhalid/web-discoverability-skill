<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello — Example Site</title>
<meta name="description" content="The single article in the clean control fixture, present so the feed has one entry to declare.">
<link rel="canonical" href="https://example.com/blog/hello">
<link rel="alternate" type="application/atom+xml" href="https://example.com/feed.xml" title="Example Site articles">
<meta property="og:type" content="article">
<meta property="og:site_name" content="Example Site">
<meta property="og:title" content="Hello">
<meta property="og:description" content="The single article in the fixture.">
<meta property="og:url" content="https://example.com/blog/hello">
<meta property="og:image" content="https://example.com/img/hello.png">
<meta property="og:image:alt" content="A greeting rendered in plain type.">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "@id": "https://example.com/blog/hello#article",
  "headline": "Hello",
  "url": "https://example.com/blog/hello",
  "datePublished": "2026-02-03",
  "author": { "@type": "Person", "name": "Fixture Maintainer" },
  "image": "https://example.com/img/hello.png"
}
</script>
</head>
<body>
<header>
<nav>
<a href="/">Home</a>
<a href="/about">About</a>
<a href="/blog/hello">Hello</a>
</nav>
</header>
<main>
<article>
<h1>Hello</h1>
<p>One article, one author, one publication date, and an absolute image URL. The
structured data describes exactly what is on the page and claims nothing else.</p>
<img src="/img/hello.png" alt="A greeting rendered in plain type." width="800" height="400">
<p>Back to <a href="/">the home page</a>.</p>
</article>
</main>
</body>
</html>
