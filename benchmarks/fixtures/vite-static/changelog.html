<!doctype html>
<html lang="en">
<head>
<!--
  Vite entry for the /changelog route, listed as `changelog` in vite.config.js.

  The feed link is the same on every entry because the feed describes the site
  rather than the page; its declared type matches the Atom document in public/,
  which is what feed-alternate-link-declared compares.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Changelog — Acme Docs</title>
<meta name="description" content="Dated releases of the Acme toolchain, newest first, with the documentation change that accompanied each one.">
<link rel="canonical" href="https://example.com/changelog">
<link rel="alternate" type="application/atom+xml" href="https://example.com/feed.xml" title="Acme Docs releases">
<link rel="stylesheet" href="/src/styles.css">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Acme Docs">
<meta property="og:title" content="Changelog — Acme Docs">
<meta property="og:description" content="Dated releases of the Acme toolchain, newest first, with the documentation change that accompanied each one.">
<meta property="og:url" content="https://example.com/changelog">
<meta property="og:image" content="https://example.com/img/preview.png">
<meta property="og:image:alt" content="The words Acme Docs on a plain background.">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<div id="app"><!--app-html--></div>
</body>
</html>
